<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" width="780" height="650" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e5845"/>
    </marker>
    <style>
      .lane { fill: #ffffff; stroke: #e3c054; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 14; }
      .box { fill: #fdf5d9; stroke: #e3c054; stroke-width: 1.5; rx: 8; }
      .mine { fill: #fcd96e; stroke: #bfa143; stroke-width: 2.5; rx: 8; }
      .src { fill: #ffffff; stroke: #e3c054; stroke-width: 2; rx: 8; }
      .title { fill: #1c180d; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .sub { fill: #5e5845; font-size: 11px; text-anchor: middle; }
      .label { fill: #5e5845; font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; text-anchor: middle; }
      .note { fill: #5e5845; font-size: 11px; font-style: italic; text-anchor: middle; }
      .edge { stroke: #5e5845; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .plain { stroke: #5e5845; stroke-width: 1.6; fill: none; }
      .dashed { stroke: #5e5845; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="780" height="650" fill="#f8f8f5"/>
  <rect x="20" y="20" width="740" height="260" class="lane"/>
  <text x="390" y="44" class="label" >BROWSER · NEXT.JS 14 APP ROUTER ON VERCEL</text>
  <rect x="30" y="62" width="160" height="60" class="mine"/>
  <text x="110" y="83" class="title">Messaging</text>
  <text x="110" y="100" class="sub">chats · 2s polling</text>
  <text x="110" y="115" class="sub">inbox · unread badge</text>
  <rect x="210" y="62" width="160" height="60" class="mine"/>
  <text x="290" y="83" class="title">Profiles &amp; Follows</text>
  <text x="290" y="100" class="sub">relationships table</text>
  <text x="290" y="115" class="sub">derived counts · popups</text>
  <rect x="390" y="62" width="160" height="60" class="mine"/>
  <text x="470" y="83" class="title">Image Pipeline</text>
  <text x="470" y="100" class="sub">crop · compress · 2 sizes</text>
  <text x="470" y="115" class="sub">upload · delete · CDN</text>
  <rect x="570" y="62" width="160" height="60" class="box"/>
  <text x="650" y="83" class="title">Teammates</text>
  <text x="650" y="100" class="sub">likes · favorites · comments</text>
  <text x="650" y="115" class="sub">notifications · Talebot</text>
  <text x="390" y="146" class="note" >also mine: filter v1 · Google Maps embed on posts · PostHog page views</text>
  <path d="M 110 122 V 160" class="plain"/>
  <path d="M 290 122 V 160" class="plain"/>
  <path d="M 470 122 V 160" class="plain"/>
  <path d="M 650 122 V 160" class="plain"/>
  <path d="M 110 160 H 650" class="plain"/>
  <path d="M 390 160 V 186" class="edge"/>
  <rect x="230" y="188" width="320" height="60" class="src"/>
  <text x="390" y="209" class="title">Supabase JS client</text>
  <text x="390" y="226" class="sub">runs inside React components</text>
  <text x="390" y="241" class="sub">row level security decides what each user can touch</text>
  <rect x="20" y="310" width="500" height="230" class="lane"/>
  <text x="270" y="334" class="label" >SUPABASE</text>
  <path d="M 390 248 V 294 H 220 V 346" class="edge"/>
  <path d="M 120 348 H 420" class="plain"/>
  <path d="M 120 348 V 350" class="edge"/>
  <path d="M 320 348 V 350" class="edge"/>
  <rect x="30" y="352" width="180" height="60" class="box"/>
  <text x="120" y="373" class="title">Auth</text>
  <text x="120" y="390" class="sub">sessions · cookies</text>
  <text x="120" y="405" class="sub">password reset</text>
  <rect x="230" y="352" width="180" height="60" class="box"/>
  <text x="320" y="373" class="title">Postgres + RLS</text>
  <text x="320" y="390" class="sub">posts · drafts · profiles</text>
  <text x="320" y="405" class="sub">relationships · chats · likes</text>
  <path d="M 320 412 V 426 H 220 V 440" class="edge"/>
  <path d="M 320 426 H 420 V 440" class="edge"/>
  <rect x="130" y="442" width="180" height="60" class="box"/>
  <text x="220" y="463" class="title">Storage</text>
  <text x="220" y="480" class="sub">posts · drafts · profile-pic</text>
  <text x="220" y="495" class="sub">images/ · videos/</text>
  <rect x="340" y="442" width="160" height="60" class="box"/>
  <text x="420" y="463" class="title">Realtime</text>
  <text x="420" y="480" class="sub">postgres_changes</text>
  <text x="420" y="495" class="sub">used by likes (teammate)</text>
  <rect x="540" y="310" width="220" height="230" class="lane"/>
  <text x="650" y="334" class="label" >EDGE &amp; THIRD PARTY</text>
  <rect x="560" y="352" width="180" height="60" class="src"/>
  <text x="650" y="373" class="title">Cloudflare Worker</text>
  <text x="650" y="390" class="sub">caches Storage objects</text>
  <text x="650" y="405" class="sub">NEXT_PUBLIC_IMAGE_CDN</text>
  <rect x="560" y="432" width="180" height="44" class="box"/>
  <text x="650" y="453" class="title">PostHog</text>
  <text x="650" y="470" class="sub">page views · events</text>
  <rect x="560" y="490" width="180" height="44" class="box"/>
  <text x="650" y="511" class="title">Google Maps Embed</text>
  <text x="650" y="528" class="sub">map preview per post</text>
  <path d="M 220 502 V 522 H 530 V 382 H 558" class="dashed"/>
  <text x="400" y="558" class="note" >image reads go through the Worker cache</text>
  <text x="390" y="590" class="note" >Every feature = a table + a client query + React state.</text>
  <text x="390" y="608" class="note" >No custom API server. Row level security is the API layer.</text>
</svg>
