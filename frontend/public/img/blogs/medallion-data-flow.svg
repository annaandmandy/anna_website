<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 616" width="760" height="616" xml:space="preserve" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e5845"/>
    </marker>
    <style>
      .panel { fill: #fdf5d9; stroke: #e3c054; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 14; }
      .card { fill: #ffffff; stroke: #e3c054; stroke-width: 1.5; rx: 8; }
      .gold { fill: #ffffff; stroke: #e3c054; stroke-width: 2; rx: 8; }
      .layer { fill: #1c180d; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .q { fill: #5e5845; font-size: 12px; font-style: italic; text-anchor: middle; }
      .tag { fill: #5e5845; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; }
      .mono { white-space: pre; fill: #1c180d; font-size: 10.5px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .dim { white-space: pre; fill: #5e5845; font-size: 10.5px; font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .hi { fill: #bfa143; font-size: 10.5px; font-weight: 700; font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .lbl { fill: #5e5845; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .edge { stroke: #5e5845; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .plain { stroke: #5e5845; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect width="760" height="616" fill="#f8f8f5"/>

  <!-- ===== BRONZE ===== -->
  <rect x="20" y="20" width="220" height="540" class="panel"/>
  <text x="130" y="50" class="layer">Bronze</text>
  <text x="130" y="70" class="q">Can I reproduce what happened?</text>

  <text x="34" y="98" class="tag">TWEETS · raw API JSON</text>
  <rect x="34" y="106" width="192" height="226" class="card"/>
  <text x="44" y="122" class="dim">bronze/tweets/2026/09/15/</text>
  <text x="44" y="136" class="dim">page_001.json</text>
  <text x="44" y="158" class="mono">{</text>
  <text x="44" y="172" class="mono">  "id_str": "196…",</text>
  <text x="44" y="186" class="mono">  "created_at": "Mon Sep 15…",</text>
  <text x="44" y="200" class="mono">  "full_text": "NVDA 🚀 …",</text>
  <text x="44" y="214" class="mono">  "favorite_count": 42,</text>
  <text x="44" y="228" class="mono">  "user": {</text>
  <text x="44" y="242" class="mono">   "followers_count": 5120,</text>
  <text x="44" y="256" class="mono">   "is_blue_verified": true,</text>
  <text x="44" y="270" class="dim">   … 40+ more fields</text>
  <text x="44" y="284" class="mono">  },</text>
  <text x="44" y="298" class="dim">  "entities": { … },</text>
  <text x="44" y="312" class="mono">}</text>

  <text x="34" y="362" class="tag">STOCK · raw OHLCV</text>
  <rect x="34" y="370" width="192" height="94" class="card"/>
  <text x="44" y="386" class="dim">bronze/stock/</text>
  <text x="44" y="406" class="mono">2026-09-15, &lt;open&gt;, &lt;high&gt;,</text>
  <text x="44" y="420" class="mono">&lt;low&gt;, &lt;close&gt;, &lt;volume&gt;</text>
  <text x="44" y="440" class="dim">date, open, high, low,</text>
  <text x="44" y="454" class="dim">close, volume</text>

  <text x="130" y="500" class="lbl">Preserve the source.</text>
  <text x="130" y="516" class="lbl">Never transform in place.</text>

  <!-- ===== SILVER ===== -->
  <rect x="270" y="20" width="220" height="540" class="panel"/>
  <text x="380" y="50" class="layer">Silver</text>
  <text x="380" y="70" class="q">Can downstream trust the structure?</text>

  <text x="284" y="98" class="tag">TWEETS · flat, typed</text>
  <rect x="284" y="106" width="192" height="226" class="card"/>
  <text x="294" y="122" class="dim">silver/tweets/</text>
  <text x="294" y="146" class="mono">tweet_id        196…</text>
  <text x="294" y="160" class="mono">created_at      09-15 06:41 ET</text>
  <text x="294" y="174" class="mono">full_text       "NVDA 🚀 …"</text>
  <text x="294" y="188" class="mono">favorite_count  42</text>
  <text x="294" y="202" class="mono">reply_count     7</text>
  <text x="294" y="216" class="mono">retweet_count   11</text>
  <text x="294" y="230" class="mono">followers_count 5120</text>
  <text x="294" y="244" class="mono">friends_count   830</text>
  <text x="294" y="258" class="mono">is_blue_verified true</text>
  <text x="294" y="282" class="dim">nested objects flattened,</text>
  <text x="294" y="296" class="dim">unused fields dropped,</text>
  <text x="294" y="310" class="dim">one schema for every day</text>

  <text x="284" y="362" class="tag">STOCK · flat, typed</text>
  <rect x="284" y="370" width="192" height="80" class="card"/>
  <text x="294" y="386" class="dim">silver/stock/</text>
  <text x="294" y="406" class="mono">date    2026-09-15</text>
  <text x="294" y="420" class="mono">close   &lt;close&gt;</text>
  <text x="294" y="434" class="mono">volume  &lt;volume&gt;</text>

  <text x="380" y="500" class="lbl">A tweet is still a tweet.</text>
  <text x="380" y="516" class="lbl">A stock row is still a stock row.</text>

  <!-- ===== GOLD ===== -->
  <rect x="520" y="20" width="220" height="540" class="panel"/>
  <text x="630" y="50" class="layer">Gold</text>
  <text x="630" y="70" class="q">What does it mean for my problem?</text>

  <text x="534" y="98" class="tag">ONE ML-READY OBSERVATION</text>
  <rect x="534" y="106" width="192" height="358" class="gold"/>
  <text x="544" y="122" class="dim">gold/ml/</text>

  <text x="544" y="146" class="tag">SESSION MAPPING</text>
  <text x="544" y="160" class="mono">tweet_time_et   06:41</text>
  <text x="544" y="174" class="mono">after 6 AM cutoff → next</text>
  <text x="544" y="188" class="hi">session_date    2026-09-16</text>

  <text x="544" y="212" class="tag">SENTIMENT (VADER)</text>
  <text x="544" y="226" class="mono">sentiment_score  0.62</text>

  <text x="544" y="250" class="tag">ENGAGEMENT</text>
  <text x="544" y="264" class="mono">interaction_score 133.4</text>
  <text x="544" y="278" class="mono">favorite_ratio    0.008</text>
  <text x="544" y="292" class="mono">is_viral          0</text>

  <text x="544" y="316" class="tag">ACCOUNT</text>
  <text x="544" y="330" class="mono">credibility_score 0.71</text>
  <text x="544" y="344" class="mono">is_influencer     1</text>
  <text x="544" y="358" class="mono">account_age_days  2140</text>

  <text x="544" y="382" class="tag">CALENDAR</text>
  <text x="544" y="396" class="mono">day_of_week 2  is_weekend 0</text>

  <text x="544" y="420" class="tag">TARGET (joined from stock)</text>
  <text x="544" y="434" class="hi">next_session_volume</text>
  <text x="544" y="448" class="hi">&lt;next-session volume&gt;</text>

  <text x="630" y="500" class="lbl">Joined on trading session.</text>
  <text x="630" y="516" class="lbl">Features defined for the problem.</text>

  <!-- ===== ARROWS ===== -->
  <path d="M 226 219 H 282" class="edge"/>
  <path d="M 226 410 H 282" class="edge"/>
  <text x="254" y="206" class="lbl" font-size="9.5">ADF</text>
  <text x="254" y="397" class="lbl" font-size="9.5">Spark</text>

  <path d="M 476 219 H 508 V 278 H 532" class="edge"/>
  <path d="M 476 410 H 508 V 278" class="plain"/>
  <text x="508" y="262" class="lbl" font-size="9.5">Spark</text>

  <text x="380" y="580" class="dim" text-anchor="middle">Bronze → Silver: ADF Mapping Data Flow (tweets) · Spark (stock)</text>
  <text x="380" y="594" class="dim" text-anchor="middle">Silver → Gold: Synapse Spark session mapping + join + features</text>
  <text x="380" y="609" class="q">Example values are illustrative, not real records.</text>
</svg>
