<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1100" width="780" height="1100" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e5845"/>
    </marker>
    <style>
