<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e5845"/>
    </marker>
    <style>
      .lane { fill: #ffffff; stroke: #e3c054; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 14; }
      .hub { fill: #fdf5d9; stroke: #e3c054; stroke-width: 1.5; rx: 8; }
      .dun { fill: #fcd96e; stroke: #e3c054; stroke-width: 2; rx: 8; }
      .code { fill: #ffffff; stroke: #bfa143; stroke-width: 2.5; rx: 8; }
      .title { fill: #1c180d; font-size: 13px; font-weight: 700; text-anchor: middle; font-family: 'SF Mono', Menlo, Consolas, monospace; }
      .sub { fill: #5e5845; font-size: 10.5px; text-anchor: middle; }
      .label { fill: #5e5845; font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; text-anchor: middle; }
      .note { fill: #5e5845; font-size: 10.5px; font-style: italic; text-anchor: middle; }
      .edge { stroke: #5e5845; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #5e5845; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="780" height="520" fill="#f8f8f5"/>
  <rect x="20" y="20" width="740" height="150" class="lane"/>
  <text x="390" y="44" class="label" >HUB · MAIN WORLD</text>
  <rect x="30" y="72" width="160" height="56" class="hub"/>
  <text x="110" y="98" class="title">intro</text>
  <text x="110" y="114" class="sub">show the world's rules</text>
  <rect x="210" y="72" width="160" height="56" class="hub"/>
  <text x="290" y="98" class="title">settling</text>
  <text x="290" y="114" class="sub">first pressure or threat</text>
  <rect x="390" y="72" width="160" height="56" class="hub"/>
  <text x="470" y="98" class="title">conflict</text>
  <text x="470" y="114" class="sub">friction · minor villain only</text>
  <rect x="570" y="72" width="160" height="56" class="hub"/>
  <text x="650" y="98" class="title">pre_dungeon</text>
  <text x="650" y="114" class="sub">tension peaks · reason to enter</text>
  <path d="M 190 100 H 208" class="edge"/>
  <path d="M 370 100 H 388" class="edge"/>
  <path d="M 550 100 H 568" class="edge"/>
  <rect x="20" y="230" width="740" height="150" class="lane"/>
  <text x="390" y="254" class="label" >DUNGEON · INSTANCE (cycle_num + 1)</text>
  <rect x="22" y="282" width="136" height="56" class="dun"/>
  <text x="90" y="308" class="title">setup</text>
  <text x="90" y="324" class="sub">rules · an NPC gets hurt</text>
  <rect x="172" y="282" width="136" height="56" class="dun"/>
  <text x="240" y="308" class="title">investigation</text>
  <text x="240" y="324" class="sub">clues · truth advances</text>
  <rect x="322" y="282" width="136" height="56" class="dun"/>
  <text x="390" y="308" class="title">twist</text>
  <text x="390" y="324" class="sub">trap · protagonist down</text>
  <rect x="472" y="282" width="136" height="56" class="dun"/>
  <text x="540" y="308" class="title">climax</text>
  <text x="540" y="324" class="sub">win by logic or loophole</text>
  <rect x="622" y="282" width="136" height="56" class="dun"/>
  <text x="690" y="308" class="title">resolution</text>
  <text x="690" y="324" class="sub">finish · back to hub</text>
  <path d="M 158 310 H 170" class="edge"/>
  <path d="M 308 310 H 320" class="edge"/>
  <path d="M 458 310 H 470" class="edge"/>
  <path d="M 608 310 H 620" class="edge"/>
  <path d="M 650 128 V 200 H 90 V 280" class="edge"/>
  <text x="370" y="194" class="note" >enter instance</text>
  <path d="M 690 338 V 400 H 8 V 100 H 28" class="dashed"/>
  <text x="390" y="414" class="note" >back to the hub · main plot moves one notch · next cycle</text>
  <rect x="20" y="440" width="740" height="60" class="lane"/>
  <rect x="180" y="450" width="420" height="40" class="code"/>
  <text x="390" y="468" class="title">finale override</text>
  <text x="390" y="484" class="sub">within 5 chapters of target ending → no new threads, only convergence</text>
  <text x="390" y="516" class="note" >every transition returns chapter_function · intensity · notes · the LLM never chooses the phase</text>
</svg>
